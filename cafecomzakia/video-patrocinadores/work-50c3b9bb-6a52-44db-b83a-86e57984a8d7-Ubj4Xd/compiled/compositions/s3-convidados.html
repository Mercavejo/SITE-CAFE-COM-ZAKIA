      gsap.set(".s3-foto-wrap, .s3-num", { opacity: 0 });

      tl.fromTo("#s3-linha", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 0.15);
      cuts.forEach((t, i) => {
        const n = i + 1;
        // Foto: chicote horizontal que aterrissa desfocada e fica nítida.
        tl.set("#s3-f" + n, { opacity: 1 }, t);
        if (i > 0) tl.set("#s3-f" + i, { opacity: 0 }, t + 0.16);
        tl.fromTo("#s3-f" + n, { x: 180 * dir[i], filter: "blur(14px)" }, { x: 0, filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, t);
        // Empurrão leve de câmera dentro do corte.
        tl.fromTo("#s3-img" + n, { scale: 1.08 }, { scale: 1.0, duration: 1.0, ease: "power1.out" }, t);
        // Palavra-tema rola para dentro; a anterior rola para fora.
        tl.set("#s3-p" + n, { opacity: 1 }, t);
        tl.fromTo("#s3-p" + n, { yPercent: 130 }, { yPercent: 0, duration: 0.18, ease: "power3.out" }, t);
        if (i > 0) {
          tl.to("#s3-p" + i, { yPercent: -130, duration: 0.14, ease: "power3.in" }, t);
          tl.set("#s3-p" + i, { opacity: 0 }, t + 0.15);
        }
        // Contador editorial.
        tl.set("#s3-n" + n, { opacity: 1 }, t);
        if (i > 0) tl.set("#s3-n" + i, { opacity: 0 }, t);
