<!-- Cena 1 — Gancho (0,0 → 1,5 s). Frase criada para a campanha. -->
<template>
  <style>
    @font-face {
      font-family: "Gelasio";
      src: url("assets/fonts/Gelasio-VF.woff2") format("woff2");
      font-weight: 400 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Inter";
      src: url("assets/fonts/Inter-VF.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #s1-bg {
      position: absolute;
      inset: -40px;
      background: url("assets/img/bg-estudio-desfocado.jpg") center / cover no-repeat;
    }
    #s1-vinheta {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 55% at 50% 45%, rgba(3, 3, 3, 0.15) 0%, rgba(3, 3, 3, 0.7) 70%, rgba(3, 3, 3, 0.92) 100%);
    }
    #s1-texto {
      position: absolute;
      left: 100px;
      right: 100px;
      top: 430px;
      font-family: var(--font-display, "Gelasio"), Georgia, serif;
      font-weight: 700;
      color: var(--color-ink, #fff);
      text-transform: uppercase;
      text-align: center;
      line-height: 1.02;
      letter-spacing: -0.01em;
    }
    #s1-texto .linha {
      display: block;
      font-size: 104px;
    }
    #s1-texto .linha.destaque {
      font-size: 150px;
      color: var(--color-accent, #ffe79a);
      line-height: 1.04;
    }
    #s1-texto .w {
      display: inline-block;
    }
    #s1-fio {
      position: absolute;
      left: 100px;
      right: 100px;
      top: 1210px;
      height: 2px;
      background: var(--color-gold, #d4af37);
      transform-origin: 0% 50%;
    }
    #s1-onda {
      position: absolute;
      left: 0;
      top: 1112px;
      width: 1080px;
      height: 200px;
      overflow: visible;
    }
    #s1-onda path {
      fill: none;
      stroke: var(--color-gold, #d4af37);
      stroke-width: 4;
      stroke-linecap: round;
    }
  </style>
  <div id="root" data-composition-id="s1-gancho" data-width="1080" data-height="1920">
    <div id="s1-bg"></div>
    <div id="s1-vinheta"></div>
    <h1 id="s1-texto">
      <span class="linha"><span class="w">Sua</span> <span class="w">marca</span></span>
      <span class="linha"><span class="w">merece</span> <span class="w">estar</span></span>
      <span class="linha"><span class="w s1-in">onde</span> <span class="w s1-in">os</span></span>
      <span class="linha destaque"><span class="w s1-in">negócios</span></span>
      <span class="linha"><span class="w s1-in">acontecem.</span></span>
    </h1>
    <div id="s1-fio"></div>
    <svg id="s1-onda" viewBox="0 0 1080 200" data-layout-ignore>
      <path id="s1-onda-path" d=""></path>
    </svg>
  </div>
  <script>
    (function () {
      // Onda de áudio dourada: amplitude determinística (sem aleatório).
      const pts = [];
      for (let i = 0; i <= 180; i++) {
        const x = (i / 180) * 1080;
        const env = Math.sin((i / 180) * Math.PI) ** 1.6;
        const y = 100 + Math.sin(i * 0.9) * Math.sin(i * 0.23 + 1.1) * 80 * env;
        pts.push((i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1));
      }
      document.getElementById("s1-onda-path").setAttribute("d", pts.join(" "));

      const tl = gsap.timeline({ paused: true });
      // Fundo: leve deriva de câmera durante toda a cena.
      tl.fromTo("#s1-bg", { scale: 1.08, x: 20 }, { scale: 1.0, x: -10, duration: 1.5, ease: "none" }, 0);
      // Linha fina dourada se desenha por baixo do texto.
      tl.fromTo("#s1-fio", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0);
      // "ONDE OS NEGÓCIOS ACONTECEM." palavra a palavra.
      tl.fromTo(
        ".s1-in",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", stagger: 0.067 },
        0.2,
      );
      // Saída: o texto desfoca; a linha vira onda de áudio.
      tl.to("#s1-texto", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, 1.28);
      tl.to("#s1-fio", { opacity: 0, duration: 0.08 }, 1.2);
      tl.fromTo("#s1-onda", { opacity: 0, scaleY: 0.05 }, { opacity: 1, scaleY: 1, duration: 0.3, ease: "power2.out" }, 1.2);
      tl.to("#s1-bg, #s1-vinheta", { opacity: 0, duration: 0.25, ease: "power2.in" }, 1.25);
      window.__timelines["s1-gancho"] = tl;
    })();
  </script>
</template>
