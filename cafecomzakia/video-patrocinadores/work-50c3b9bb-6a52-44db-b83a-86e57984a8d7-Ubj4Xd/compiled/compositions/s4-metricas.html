  <style>

  <script>
    (function () {
      // number-wheel (registro): uma coluna por dígito, rolando de 0 até o valor.
      document.querySelectorAll("#s4-n1.hf-number-wheel").forEach((el) => {
        if (el.dataset.hfNumberWheelReady === "1") return;
        const value = el.dataset.value || "0";
        el.textContent = "";
        for (const ch of value) {
          if (!/\d/.test(ch)) {
            el.append(document.createTextNode(ch));
            continue;
          }
          const stops = Number(ch);
          const frame = document.createElement("span");
          frame.className = "hf-number-wheel-digit";
          const strip = document.createElement("span");
          strip.className = "hf-number-wheel-strip";
          strip.dataset.target = String(-stops);
          for (let i = 0; i <= stops; i++) {
            const s = document.createElement("span");
            // Dígitos fora da janela do contador ficam ocultos de propósito durante a rolagem.
            s.setAttribute("data-layout-allow-occlusion", "");
            s.textContent = String(i % 10);
            strip.appendChild(s);
          }
          frame.appendChild(strip);
          el.appendChild(frame);
        }
        el.dataset.hfNumberWheelReady = "1";
      });

      gsap.set("#s4-u1, #s4-u2", { opacity: 0 });
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s4-bg", { opacity: 0, scale: 1.08 }, { opacity: 0.5, scale: 1.0, duration: 2.7, ease: "power1.out" }, 0);
      tl.fromTo(".s4-grade", { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "expo.out", stagger: 0.06 }, 0);
      // Métrica 1: "+ DE" → o 6 rola até parar → "MILHÕES" sobe pela máscara → legenda.
      tl.fromTo("#s4-pre1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, 0.03);
      tl.fromTo("#s4-n1", { opacity: 0 }, { opacity: 1, duration: 0.08 }, 0.0);
      tl.fromTo(
        "#s4-n1 .hf-number-wheel-strip",
        { y: "0em" },
        { y: (_, el) => el.dataset.target + "em", duration: 0.6, ease: "power3.out" },
        0.0,
      );
      tl.set("#s4-u1", { opacity: 1 }, 0.14);
      tl.fromTo("#s4-u1", { yPercent: 140 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, 0.14);
      tl.fromTo("#s4-l1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 0.35);
      // Separador.
      tl.fromTo("#s4-fio", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.7);
      // Métrica 2.
      tl.fromTo("#s4-n2", { opacity: 0, scale: 1.08, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 1.0);
      tl.set("#s4-u2", { opacity: 1 }, 1.1);
      tl.fromTo("#s4-u2", { yPercent: 140 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, 1.1);
      tl.fromTo("#s4-l2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 1.3);
      tl.fromTo("#s4-fonte", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.45);
      // Saída: troca por desfoque.
      tl.to("#s4-b1, #s4-b2, #s4-fio, #s4-fonte, .s4-grade", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 2.78);
      tl.to("#s4-bg", { opacity: 0, duration: 0.2, ease: "power2.in" }, 2.78);
      window.__timelines["s4-metricas"] = tl;
    })();
  </script>
