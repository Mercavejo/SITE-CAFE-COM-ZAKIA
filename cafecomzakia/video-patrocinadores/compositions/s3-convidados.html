  <script>
    (function () {
      // Estados iniciais (fora da timeline, valem já no quadro 0).
      gsap.set(".s3-palavra", { yPercent: 130, opacity: 0 });
      gsap.set(".s3-foto-wrap", { opacity: 0 });
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s3-kicker", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out" }, 0.02);
      tl.fromTo("#s3-moldura", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.05);
      tl.fromTo("#s3-linha", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 0.15);
      // Seis cortes de convidados, um a cada meia batida dupla (0,5 s), com chicote alternado.
      for (let i = 0; i < 6; i++) {
        const n = i + 1;
        const t = i * 0.5;
        const dir = i % 2 ? -1 : 1;
        tl.set("#s3-f" + n, { opacity: 1 }, t);
        if (i > 0) tl.set("#s3-f" + i, { opacity: 0 }, t + 0.14);
        tl.fromTo("#s3-f" + n, { x: 150 * dir, filter: "blur(12px)" }, { x: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, t);
        tl.fromTo("#s3-img" + n, { scale: 1.07 }, { scale: 1.0, duration: 0.5, ease: "power1.out" }, t);
      }
      // Palavras do trailer oficial, uma por batida dupla (1 s).
      for (let i = 0; i < 3; i++) {
        const n = i + 1;
        const t = i * 1.0;
        tl.set("#s3-p" + n, { opacity: 1 }, t);
        tl.fromTo("#s3-p" + n, { yPercent: 130 }, { yPercent: 0, duration: 0.18, ease: "power3.out" }, t);
        if (i > 0) {
          tl.to("#s3-p" + i, { yPercent: -130, duration: 0.14, ease: "power3.in" }, t);
          tl.set("#s3-p" + i, { opacity: 0 }, t + 0.15);
        }
      }
      // Saída: escurece ~45% nos últimos 3 quadros e corta seco na batida.
      tl.to("#s3-dip", { opacity: 0.45, duration: 0.05, ease: "none" }, 2.95);
      window.__timelines["s3-convidados"] = tl;
    })();
  </script>
