      // Mesma onda da cena 1 (continuidade no corte).
      const pts = [];

        const x = (i / 180) * 1080;
        const env = Math.sin((i / 180) * Math.PI) ** 1.6;
        const y = 100 + Math.sin(i * 0.9) * Math.sin(i * 0.23 + 1.1) * 80 * env;

      }
      document.getElementById("s2-onda-path").setAttribute("d", pts.join(" "));

      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#s2-onda-wrap", { y: 0, scaleX: 1 }, { y: -521, scaleX: 560 / 1080, duration: 0.36, ease: "expo.inOut" }, 0.02);
      tl.fromTo("#s2-fio", { opacity: 0 }, { opacity: 1, duration: 0.06 }, 0.36);
      tl.to("#s2-onda-wrap", { opacity: 0, duration: 0.06 }, 0.38);
      // Logo revelado da esquerda para a direita, e então parado.

      tl.fromTo("#s2-brilho", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.05);
      // Subtítulos por desfoque.
      tl.fromTo("#s2-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 0.35);
      tl.fromTo("#s2-apres", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 0.55);
      // Quadro do estúdio abre de baixo para cima; câmera desliza dentro dele.
      tl.fromTo("#s2-foto-mask", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power3.out" }, 0.4);
      tl.fromTo("#s2-moldura, .s2-canto", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.04 }, 0.6);
      tl.fromTo("#s2-foto", { scale: 1.14, x: 34 }, { scale: 1.02, x: -24, duration: 1.75, ease: "power2.inOut" }, 0.4);
