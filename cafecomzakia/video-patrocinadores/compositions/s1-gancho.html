  <script>
    (function () {
      // Onda de áudio dourada: amplitude determinística (sem aleatório).
      const pts = [];
      for (let i = 0; i <= 180; i++) {
        const x = (i / 180) * 1080;
        const env = Math.sin((i / 180) * Math.PI) ** 1.6;
        const y = 100 + Math.sin(i * 0.9) * Math.sin(i * 0.23 + 1.1) * 80 * env;
        pts.push((i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1));
      }
      document.getElementById("s1-onda-path").setAttribute("d", pts.join(" "));

      const tl = gsap.timeline({ paused: true });
      // Câmera desliza pela mesa real (do convidado para o apresentador).
      tl.fromTo("#s1-img", { x: -330, scale: 1.04 }, { x: -470, scale: 1.0, duration: 1.5, ease: "none" }, 0);
      // Resto da pergunta, palavra a palavra.
      tl.fromTo(
        ".s1-in",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", stagger: 0.09 },
        0.2,
      );
      // Saída: texto e foto desfocam; surge a onda de áudio que leva à cena 2.
      tl.to("#s1-texto", { opacity: 0, filter: "blur(10px)", duration: 0.15, ease: "power2.in" }, 1.34);
      tl.to("#s1-foto", { opacity: 0, filter: "blur(12px)", duration: 0.25, ease: "power2.in" }, 1.25);
      tl.fromTo("#s1-onda", { opacity: 0, scaleY: 0.05 }, { opacity: 1, scaleY: 1, duration: 0.3, ease: "power2.out" }, 1.2);
      window.__timelines["s1-gancho"] = tl;
    })();
  </script>
